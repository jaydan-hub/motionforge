<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MotionForge — One-Loader Version</title>

<!-- ✅ ISANG LINK LANG — THREE.JS + GLTFLoader NA KASAMA NA -->
<script src="https://unpkg.com/three@0.160.0/dist/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
body{background:#0f172a;color:#f1f5f9;padding-bottom:40px;}
header{background:linear-gradient(90deg,#8b5cf6,#06b6d4);padding:15px;text-align:center;font-size:18px;font-weight:bold;}
#canvas-container{width:100%;height:300px;background:#1e293b;position:relative;}
canvas{width:100%;height:100%;display:block;}
.status{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.8);padding:8px 12px;border-radius:6px;font-size:13px;max-width:90%;}
.container{padding:15px;max-width:500px;margin:0 auto;}
.card{background:#1e293b;border-radius:12px;padding:18px;margin-bottom:15px;}
h2{font-size:16px;margin-bottom:12px;}
.upload-box{border:2px dashed #8b5cf6;border-radius:8px;padding:30px;text-align:center;cursor:pointer;}
.upload-box:hover{background:rgba(139,92,246,.08);}
input[type="file"]{display:none;}
.info{margin-top:12px;padding:12px;background:#334155;border-radius:6px;font-size:14px;display:none;}
.error{color:#f87171;}
.success{color:#4ade80;}
.wait{color:#facc15;}
.buttons{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
.btn{padding:10px 16px;background:#334155;border-radius:6px;cursor:pointer;}
.btn.active{background:#8b5cf6;}
</style>
</head>
<body>

<header>✨ MotionForge — One-Loader Version</header>

<div id="canvas-container">
  <canvas id="c"></canvas>
  <div class="status" id="status">⏳ Checking libraries...</div>
</div>

<div class="container">
  <div class="card">
    <h2>📂 Upload Your .GLB</h2>
    <label class="upload-box" for="fileInput">
      <div style="font-size:24px;margin-bottom:8px;">📦</div>
      <strong>CLICK TO SELECT .GLB</strong>
    </label>
    <input type="file" id="fileInput" accept=".glb">
    <div class="info" id="fileInfo">
      <div><strong>File:</strong> <span id="fName"></span></div>
      <div><strong>Size:</strong> <span id="fSize"></span></div>
      <div id="fMsg"></div>
    </div>
  </div>

  <div class="card">
    <h2>🎬 Controls</h2>
    <div class="buttons">
      <span class="btn" data-a="spin">🔄 Spin</span>
      <span class="btn" data-a="stop">⏹️ Stop</span>
      <span class="btn" data-a="reset">↩️ Reset</span>
    </div>
  </div>

  <div class="card">
    <h2>🔍 Library Check</h2>
    <div id="libStatus">
      <div id="threeCheck">⏳ Three.js: Checking...</div>
      <div id="loaderCheck">⏳ GLTFLoader: Checking...</div>
    </div>
  </div>
</div>

<script>
let scene, camera, renderer, model=null, spin=false;
const status=document.getElementById('status');
const fileInput=document.getElementById('fileInput');
const fileInfo=document.getElementById('fileInfo');
const fName=document.getElementById('fName');
const fSize=document.getElementById('fSize');
const fMsg=document.getElementById('fMsg');

// ✅ CHECK LIBRARIES ON LOAD
window.onload=function(){
  setTimeout(checkLibs, 500);
};

function checkLibs(){
  const threeCheck=document.getElementById('threeCheck');
  const loaderCheck=document.getElementById('loaderCheck');
  
  if(typeof THREE !== 'undefined'){
    threeCheck.innerHTML='✅ Three.js: LOADED (v'+THREE.REVISION+')';
    threeCheck.style.color='#4ade80';
  }else{
    threeCheck.innerHTML='❌ Three.js: NOT FOUND';
    threeCheck.style.color='#f87171';
  }
  
  if(typeof THREE !== 'undefined' && typeof THREE.GLTFLoader !== 'undefined'){
    loaderCheck.innerHTML='✅ GLTFLoader: LOADED';
    loaderCheck.style.color='#4ade80';
    status.textContent='✅ ALL READY! Upload your .GLB below';
    initScene();
  }else{
    loaderCheck.innerHTML='❌ GLTFLoader: NOT FOUND';
    loaderCheck.style.color='#f87171';
    status.textContent='❌ Libraries failed to load — try hard refresh';
  }
}

function initScene(){
  const c=document.getElementById('c');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1e293b);
  
  camera=new THREE.PerspectiveCamera(50,c.clientWidth/c.clientHeight,.1,100);
  camera.position.set(0,1.5,4);
  camera.lookAt(0,1,0);
  
  renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});
  renderer.setSize(c.clientWidth,c.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  
  scene.add(new THREE.AmbientLight(0xffffff,.7));
  const d=new THREE.DirectionalLight(0xffffff,1.2);
  d.position.set(3,5,3);
  scene.add(d);
  scene.add(new THREE.GridHelper(6,12,0x475569,0x334155));
  
  animate();
}

fileInput.addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file)return;
  
  fileInfo.style.display='block';
  fName.textContent=file.name;
  fSize.textContent=(file.size/1024/1024).toFixed(2)+' MB';
  
  if(!file.name.toLowerCase().endsWith('.glb')){
    fMsg.innerHTML='<span class="error">❌ Not a .glb file</span>';
    return;
  }
  
  if(typeof THREE === 'undefined' || typeof THREE.GLTFLoader === 'undefined'){
    fMsg.innerHTML='<span class="error">❌ Libraries not loaded yet — refresh page</span>';
    return;
  }
  
  fMsg.innerHTML='<span class="wait">⏳ Loading...</span>';
  
  try{
    const buf=await file.arrayBuffer();
    const v=new DataView(buf);
    if(v.getUint32(0,true)!==0x46546C67){
      fMsg.innerHTML='<span class="error">❌ Invalid GLB</span>';
      return;
    }
    
    const loader=new THREE.GLTFLoader();
    loader.parse(buf,'',gltf=>{
      if(model)scene.remove(model);
      model=gltf.scene;
      
      const box=new THREE.Box3().setFromObject(model);
      const c=box.getCenter(new THREE.Vector3());
      const s=box.getSize(new THREE.Vector3());
      const sf=2/Math.max(s.x,s.y,s.z);
      model.position.sub(c.clone().multiplyScalar(sf));
      model.position.y=0;
      model.scale.setScalar(sf);
      
      scene.add(model);
      fMsg.innerHTML='<span class="success">✅ MODEL LOADED!</span>';
      
    },err=>{
      fMsg.innerHTML='<span class="error">❌ '+err.message+'</span>';
    });
    
  }catch(err){
    fMsg.innerHTML='<span class="error">❌ '+err.message+'</span>';
  }
});

document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    if(b.dataset.a==='spin')spin=true;
    else if(b.dataset.a==='stop')spin=false;
    else if(b.dataset.a==='reset'&&model){model.rotation.set(0,0,0);spin=false;}
  });
});

function animate(){
  requestAnimationFrame(animate);
  if(model&&spin)model.rotation.y+=0.015;
  if(renderer)renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  const c=document.getElementById('c');
  if(camera&&renderer){
    renderer.setSize(c.clientWidth,c.clientHeight);
    camera.aspect=c.clientWidth/c.clientHeight;
    camera.updateProjectionMatrix();
  }
});

</script>
</body>
</html>
