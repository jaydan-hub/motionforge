<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>MotionForge — Fixed</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;}
body{background:#0f172a;color:#f1f5f9;padding-bottom:30px;}
header{background:linear-gradient(90deg,#8b5cf6,#06b6d4);padding:15px;text-align:center;font-size:18px;font-weight:bold;}
#canvas-container{width:100%;height:300px;background:#1e293b;position:relative;}
canvas{width:100%;height:100%;display:block;}
.status{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.75);padding:8px 12px;border-radius:6px;font-size:13px;max-width:85%;}
.container{padding:15px;max-width:500px;margin:0 auto;}
.card{background:#1e293b;border-radius:12px;padding:15px;margin-bottom:15px;}
h2{font-size:16px;margin-bottom:12px;}
button{width:100%;border:none;border-radius:8px;padding:12px;font-size:15px;font-weight:600;cursor:pointer;margin:5px 0;}
.btn-purple{background:linear-gradient(90deg,#8b5cf6,#7c3aed);color:white;}
.btn-green{background:#22c55e;color:#052e16;}
.btn-cyan{background:#06b6d4;color:#083344;}
.btn-gray{background:#475569;color:white;}
.file-btn{border:2px dashed #8b5cf6;border-radius:8px;padding:25px;text-align:center;cursor:pointer;display:block;}
.file-btn:hover{background:rgba(139,92,246,.08);}
input[type="file"]{display:none;}
.preview-info{margin-top:10px;padding:10px;background:#334155;border-radius:6px;font-size:13px;display:none;}
.error{color:#f87171;margin-top:8px;font-size:13px;}
.success{color:#4ade80;margin-top:8px;font-size:13px;}
.anim-btn{width:auto;display:inline-block;padding:8px 12px;margin:4px;border-radius:6px;background:#334155;}
.anim-btn.active{background:#8b5cf6;}
</style>
</head>
<body>

<header>✨ MotionForge — Skeleton & Animation Kit</header>

<div id="canvas-container">
  <canvas id="c"></canvas>
  <div class="status" id="status">✅ Ready — Upload your .GLB file</div>
</div>

<div class="container">

  <div class="card">
    <h2>📂 Upload Your .GLB Model</h2>
    <label class="file-btn" for="finput">
      <strong>📄 CLICK HERE TO SELECT .GLB FILE</strong>
      <p style="font-size:13px;color:#94a3b8;margin-top:5px;">Only .glb files • Max 50MB</p>
    </label>
    <input type="file" id="finput" accept=".glb">
    <div class="preview-info" id="finfo">
      <strong>File:</strong> <span id="fname"></span><br>
      <strong>Size:</strong> <span id="fsize"></span>
      <div id="fmsg"></div>
    </div>
  </div>

  <div class="card">
    <h2>🎬 Animate</h2>
    <button class="btn-green" id="applyBtn">🟢 APPLY ANIMATIONS TO MY MODEL</button>
    <div style="text-align:center;margin:10px 0;">
      <span class="anim-btn" data-a="idle">Idle</span>
      <span class="anim-btn" data-a="walk">Walk</span>
      <span class="anim-btn" data-a="run">Run</span>
      <span class="anim-btn" data-a="jump">Jump</span>
    </div>
  </div>

  <div class="card">
    <h2>💾 Save</h2>
    <button class="btn-cyan" id="saveGlb">📦 Download .GLB</button>
  </div>

</div>

<script type="module">
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

// ===== THREE.JS SCENE =====
let scene, camera, renderer, mixer=null, userModel=null;
let animations={}, currentAction=null;
const S=document.getElementById('status');
function setStatus(t){S.textContent=t;console.log('[MF]',t);}

function init(){
  const c=document.getElementById('c');
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x1e293b);
  camera=new THREE.PerspectiveCamera(55,c.clientWidth/c.clientHeight,.1,100);
  camera.position.set(0,1.5,3.2);
  camera.lookAt(0,1,0);
  renderer=new THREE.WebGLRenderer({canvas:c,antialias:true});
  renderer.setSize(c.clientWidth,c.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  
  scene.add(new THREE.AmbientLight(0xffffff,.7));
  const d=new THREE.DirectionalLight(0xffffff,1.2);
  d.position.set(3,4,3);scene.add(d);
  scene.add(new THREE.GridHelper(6,12,0x475569,0x334155));
  
  buildAnimations();
  animate();
}

// ===== ANIMATIONS =====
function buildAnimations(){
  animations={
    idle:makeClip('idle',2,[
      {n:'Hips',t:[0,0.9,0]},{n:'Spine',t:[0,1.2,0]},{n:'Head',t:[0,1.7,0]},
      {n:'LeftArm',t:[-0.5,1.2,0],r:[0,Math.sin,.1]},
      {n:'RightArm',t:[0.5,1.2,0],r:[0,-Math.sin,-.1]}
    ]),
    walk:makeClip('walk',1,[
      {n:'Hips',t:[0,.9+Math.abs(Math.sin)*.05,0]},
      {n:'LeftLeg',t:[-.2,.35,0],r:[Math.sin,0,0]},
      {n:'RightLeg',t:[.2,.35,0],r:[-Math.sin,0,0]}
    ]),
    run:makeClip('run',.6,[
      {n:'Hips',t:[0,.95+Math.abs(Math.sin)*.08,0]},
      {n:'LeftLeg',t:[-.2,.35,0],r:[Math.sin*1.5,0,0]},
      {n:'RightLeg',t:[.2,.35,0],r:[-Math.sin*1.5,0,0]}
    ]),
    jump:makeClip('jump',1,[
      {n:'Hips',t:[0,Math.max(0,Math.sin*2.2),0]},
      {n:'LeftArm',t:[-.5,1.2,0],r:[-.6,0,0]},
      {n:'RightArm',t:[.5,1.2,0],r:[-.6,0,0]}
    ])
  };
}

function makeClip(name,dur,bones){
  const tracks=[];
  const t=new Float32Array([0,dur/2,dur]);
  bones.forEach(b=>{
    const px=typeof b.t[0]==='function'?[0,b.t[0](0),b.t[0](1)]:[b.t[0],b.t[0],b.t[0]];
    const py=typeof b.t[1]==='function'?[0,b.t[1](0),b.t[1](1)]:[b.t[1],b.t[1],b.t[1]];
    const pz=typeof b.t[2]==='function'?[0,b.t[2](0),b.t[2](1)]:[b.t[2],b.t[2],b.t[2]];
    const pv=new Float32Array([px[0],py[0],pz[0], px[1],py[1],pz[1], px[2],py[2],pz[2]]);
    tracks.push(new THREE.VectorKeyframeTrack(b.n+'.position',t,pv));
    const r=[b.r?.[0]||0,b.r?.[1]||0,b.r?.[2]||0];
    const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(r[0],r[1],r[2]));
    const qv=new Float32Array([q.x,q.y,q.z,q.w, q.x,q.y,q.z,q.w, q.x,q.y,q.z,q.w]);
    tracks.push(new THREE.QuaternionKeyframeTrack(b.n+'.quaternion',t,qv));
  });
  return new THREE.AnimationClip(name,dur,tracks);
}

function playAnim(name){
  if(!mixer){setStatus('⚠️ Upload model first');return;}
  if(currentAction)currentAction.fadeOut(.15);
  const clip=animations[name];
  if(!clip)return;
  const a=mixer.clipAction(clip);
  a.reset().setLoop(THREE.LoopRepeat).play();
  currentAction=a;
  document.querySelectorAll('.anim-btn').forEach(e=>e.classList.remove('active'));
  document.querySelector(`[data-a="${name}"]`)?.classList.add('active');
  setStatus('▶ Playing: '+name);
}

// ===== FILE UPLOAD =====
const finput=document.getElementById('finput');
const finfo=document.getElementById('finfo');
const fname=document.getElementById('fname');
const fsize=document.getElementById('fsize');
const fmsg=document.getElementById('fmsg');

finput.addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file)return;
  
  finfo.style.display='block';
  fname.textContent=file.name;
  fsize.textContent=(file.size/1024/1024).toFixed(2)+' MB';
  
  if(!file.name.toLowerCase().endsWith('.glb')){
    fmsg.innerHTML='<span class="error">❌ Not a .glb file!</span>';
    return;
  }
  if(file.size>50*1024*1024){
    fmsg.innerHTML='<span class="error">❌ File too large (max 50MB)</span>';
    return;
  }
  
  fmsg.innerHTML='<span style="color:#facc15">⏳ Loading...</span>';
  setStatus('📂 Reading: '+file.name);
  
  try{
    const buf=await file.arrayBuffer();
    const v=new DataView(buf);
    if(v.getUint32(0,true)!==0x46546C67){
      fmsg.innerHTML='<span class="error">❌ Not a valid GLB file</span>';
      setStatus('❌ Invalid GLB');
      return;
    }
    
    fmsg.innerHTML='<span class="success">✅ File OK — loading model...</span>';
    setStatus('🔄 Loading 3D model...');
    
    if(userModel) scene.remove(userModel);
    
    const loader=new GLTFLoader();
    loader.parse(buf,'',gltf=>{
      userModel=gltf.scene;
      scene.add(userModel);
      
      // Center & scale
      const box=new THREE.Box3().setFromObject(userModel);
      const c=box.getCenter(new THREE.Vector3());
      const s=box.getSize(new THREE.Vector3());
      const sf=1.8/Math.max(s.x,s.y,s.z);
      userModel.position.sub(c.clone().multiplyScalar(sf));
      userModel.position.y=0;
      userModel.scale.setScalar(sf);
      
      fmsg.innerHTML+='<br><span class="success">✅ Model Loaded! Click APPLY ANIMATIONS</span>';
      setStatus('✅ Ready — click Apply Animations');
      
    },err=>{
      fmsg.innerHTML='<span class="error">❌ Error: '+err.message+'</span>';
      setStatus('❌ Load failed: '+err.message);
    });
    
  }catch(err){
    fmsg.innerHTML='<span class="error">❌ Error: '+err.message+'</span>';
    setStatus('❌ Read failed');
  }
});

// ===== BUTTONS =====
document.getElementById('applyBtn').addEventListener('click',()=>{
  if(!userModel){
    alert('⚠️ Upload a .GLB file first!');
    return;
  }
  mixer=new THREE.AnimationMixer(userModel);
  playAnim('idle');
  alert('✅ Animations Connected!\n\nNow click Walk/Run/Jump');
});

document.querySelectorAll('.anim-btn').forEach(b=>{
  b.addEventListener('click',()=>playAnim(b.dataset.a));
});

document.getElementById('saveGlb').addEventListener('click',async()=>{
  if(!userModel){alert('Upload model first!');return;}
  setStatus('📦 Preparing download...');
  const { GLTFExporter } = await import('three/addons/exporters/GLTFExporter.js');
  const exporter=new GLTFExporter();
  exporter.parse(userModel,result=>{
    const blob=new Blob([result],{type:'application/octet-stream'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='model.glb';a.click();
    URL.revokeObjectURL(url);
    setStatus('✅ Download started! Check your Downloads');
  },err=>{setStatus('❌ Export failed');console.error(err);});
});

// ===== ANIMATE LOOP =====
function animate(){
  requestAnimationFrame(animate);
  if(mixer) mixer.update(Math.min(0.05,1/60));
}

window.addEventListener('resize',()=>{
  const c=document.getElementById('c');
  renderer.setSize(c.clientWidth,c.clientHeight);
  camera.aspect=c.clientWidth/c.clientHeight;
  camera.updateProjectionMatrix();
});

init();
</script>

</body>
</html>
